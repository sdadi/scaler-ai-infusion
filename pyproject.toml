[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaler-ai-infusion"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    strands-agents
    strands-agents-tools
]

[tool.setuptools.packages.find]
where = ["."]  # Tells it to look in the root folder

